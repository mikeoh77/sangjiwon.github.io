<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>(주)상지원</title>
<style>
  :root {
    --cream: #fdf6e6;
    --cream-deep: #f8e4c2;
    --orange: #f26a0f;
    --red-orange: #ff3d00;
    --ink: #3a2f26;
    --muted: #8a7a6a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --d: min(86vw, 420px, calc(100vh - 170px)); }
  @supports (height: 100dvh) { :root { --d: min(86vw, 420px, calc(100dvh - 170px)); } }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--cream);
    color: var(--ink);
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }

  header {
    background: linear-gradient(to bottom, #ffffff 0%, var(--cream) 100%);
    padding: 12px 5vw 8px;
  }
  .logo { display: block; height: clamp(44px, 9vh, 72px); width: auto; mix-blend-mode: multiply; }

  .band {
    height: 24px;
    background: linear-gradient(to bottom, var(--cream-deep), var(--cream));
    border-top: 1px solid #efd9b3;
    border-bottom: 1px solid #efd9b3;
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 5vw;
    min-height: 0;
  }

  .circle {
    width: var(--d);
    height: var(--d);
    flex-shrink: 0;
    border-radius: 50%;
    border: 8px solid var(--orange);
    background: #fffdf8;
    box-shadow: 0 0 0 6px rgba(242, 106, 15, 0.12);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0;
  }
  .label {
    font-size: calc(var(--d) * 0.03);
    letter-spacing: 4px;
    color: var(--orange);
    margin-bottom: calc(var(--d) * 0.03);
  }
  h1 {
    font-size: calc(var(--d) * 0.057);
    line-height: 1.5;
    white-space: nowrap;
    font-weight: 700;
    color: var(--ink);
  }
  h1 .em { color: var(--red-orange); }
  .divider {
    width: 48px;
    height: 3px;
    background: var(--orange);
    border-radius: 2px;
    margin: calc(var(--d) * 0.045) 0;
  }
  p {
    font-size: calc(var(--d) * 0.038);
    line-height: 1.7;
    white-space: nowrap;
    color: var(--ink);
  }

</style>
</head>
